<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jakpat stream</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
* { box-sizing: border-box; }
:root { --accent: #ff0000; }

body { 
    background: #0f0f0f; 
    color: white; 
    font-family: sans-serif; 
    margin: 0; 
    overflow: hidden; 
}

/* --- LAYOUT --- */
.main-wrapper {
    display: flex;
    flex-wrap: nowrap;
    width: 100%;
    height: 100vh;
    background: #0f0f0f;
}

/* Scrollbar Styling */
.player-section::-webkit-scrollbar, .main-wrapper::-webkit-scrollbar { width: 8px; }
.player-section::-webkit-scrollbar-track, .main-wrapper::-webkit-scrollbar-track { background: #0f0f0f; }
.player-section::-webkit-scrollbar-thumb, .main-wrapper::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
.player-section { -ms-overflow-style: none; scrollbar-width: none; flex: 1; height: 100vh; overflow-y: auto; padding: 0 40px 40px 20px; }
.player-section::-webkit-scrollbar { display: none; }

.chat-section {
    width: 350px;
    height: 100vh;
    border-left: 2px solid var(--accent);
    background: #050505;
    flex-shrink: 0;
    box-shadow: -5px 0 15px rgba(255, 0, 0, 0.05);
}

iframe { display: block; background: transparent; }

/* --- PLAYER & CURSOR --- */
.player-area { 
    position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16/9; 
    background: #000; margin-top: 20px; border-radius: 12px; overflow: hidden; 
}

video { width: 100%; height: 100%; display: block; cursor: pointer; background: #000; }

.cursor-hidden, .cursor-hidden * { cursor: none !important; }
#controls-bar { cursor: auto; }

/* --- THEATRE MODE (GLOBAL) --- */
body.theatre-mode .chat-section,
body.theatre-mode .info-section { display: none !important; }

body.theatre-mode .player-section { width: 100vw; padding: 0; overflow: hidden; }

body.theatre-mode .player-area { 
    max-width: 100vw; width: 100vw; height: 100vh; 
    margin-top: 0; border-radius: 0; 
}

/* --- RESPONSIVE & MOBILE FIX --- */
@media (max-width: 1000px) {
    .main-wrapper { 
        flex-direction: column; 
        overflow-y: auto; 
        height: 100vh;
    }
    
    .player-section { 
        padding: 0; 
        flex: 0 0 auto;
        width: 100%;
    }

    .player-area {
        margin-top: 0;
        border-radius: 0;
    }

    .chat-section { 
        width: 100%; 
        height: 60vh;
        flex-shrink: 0; 
        border-left: none; 
        border-top: 2px solid var(--accent); 
    }

    /* Special Mobile Theatre Fix */
    body.theatre-mode .player-area {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 9999 !important;
        height: 100vh !important;
        height: -webkit-fill-available !important;
    }
}

/* --- UI ELEMENTS --- */
#offline-overlay, #start-overlay, #loading-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; }
#offline-overlay { z-index: 500; background: #000; flex-direction: column; }
#start-overlay { z-index: 150; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); cursor: pointer; }
#loading-overlay { z-index: 130; pointer-events: none; background: rgba(0,0,0,0.6); display: flex; }

.offline-text { color: var(--accent); font-size: 34px; font-weight: 900; letter-spacing: 4px; }
.big-play-btn { width: 90px; height: 90px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
.spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes breathe { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }

#controls-bar { 
    position: absolute; bottom: 0; left: 0; right: 0; height: 80px; 
    display: none; align-items: center; padding: 0 20px; 
    background: linear-gradient(transparent, rgba(0,0,0,0.9)); z-index: 120; 
}
.ui-visible { display: flex !important; }

.ctrl-group { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 30px; }
button { background: none; border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; transition: transform 0.1s; }
button:hover { transform: scale(1.15); }

#live-badge { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #444; color: white; cursor: pointer; }
#live-badge.is-live { background: var(--accent); }

.vol-pill { margin-left: auto; margin-right: 10px; position: relative; }
input[type=range] { width: 80px; accent-color: var(--accent); cursor: pointer; outline: none; }

/* Tooltips */
.tip-box { position: relative; display: flex; align-items: center; justify-content: center; }
.tip-text { 
    position: absolute; bottom: 125%; background: rgba(20, 20, 20, 0.95); color: white; 
    padding: 6px 12px; border-radius: 8px; font-size: 12px; white-space: nowrap; 
    pointer-events: none; opacity: 0; transition: 0.2s; transform: translateY(8px); 
    border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.tip-box:hover .tip-text { opacity: 1; transform: translateY(0); }
.sc-key { color: #888; margin-left: 8px; font-size: 10px; background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 3px; }

.info-section { width: 100%; max-width: 1280px; padding: 20px; }
.description-box { background: #222; padding: 15px; border-radius: 8px; margin-top: 10px; }

#playBtn { 
    min-width: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
}
    </style>
</head>
<body class="hide-ui">

  <div class="main-wrapper"> <div class="player-section"> <div class="player-area" id="main-container" onmousemove="showUI()">
        <div id="offline-overlay">
          <div class="offline-icon">📡</div>
          <div class="offline-text">OFFLINE</div>
          <div class="reconnecting-text">Attempting to reconnect...</div>
        </div>

        <div id="start-overlay" onclick="startPlayer()"><div class="big-play-btn">▶</div></div>
        <div id="loading-overlay"><div class="spinner"></div></div>

        <video id="video" playsinline muted onclick="handleVideoClick()"></video>

        <div id="controls-bar">
          <div class="ctrl-group">
            <div class="tip-box">
              <button id="playBtn" onclick="togglePlay()">II</button>
              <span class="tip-text">Play/Pause <span class="sc-key">Space</span></span>
            </div>
            <div class="tip-box">
              <div id="live-badge" onclick="syncLive()">LIVE</div>
              <span class="tip-text">Sync Live <span class="sc-key">L</span></span>
            </div>
          </div>

          <div class="ctrl-group vol-pill" id="volume-area">
            <div class="tip-box">
              <button id="muteBtn" onclick="toggleMute()">🔊</button>
              <span class="tip-text">Mute <span class="sc-key">M</span></span>
            </div>
            <input type="range" id="volSlider" min="0" max="1" step="0.05" oninput="updateVol(this.value)">
            <span class="tip-text" style="bottom: 125%; left: 50%; transform: translateX(-50%);">Scroll to Adjust</span>
          </div>

          <div class="ctrl-group">
            <div class="tip-box">
              <button onclick="document.body.classList.toggle('theatre-mode')">🍿</button>
              <span class="tip-text">Theatre Mode <span class="sc-key">T</span></span>
            </div>
            <div class="tip-box">
              <button onclick="togglePiP()">📺</button>
              <span class="tip-text">PiP Mode <span class="sc-key">P</span></span>
            </div>
            <div class="tip-box">
              <button onclick="toggleFS()">⛶</button>
              <span class="tip-text">Fullscreen <span class="sc-key">F</span></span>
            </div>
          </div>
        </div>
      </div>

      <div class="info-section">
        <h1>jakpat stream</h1>
        <div class="description-box">jakpat</div>
      </div>
    </div> <div class="chat-section"> <iframe src="https://www5.cbox.ws/box/?boxid=960550&boxtag=dK1FUi&tid=1&tkey=1529971c1259c1c4" 
              width="100%" 
              height="100%" 
              allowtransparency="yes" 
              allow="autoplay" 
              frameborder="0" 
              marginheight="0" 
              marginwidth="0" 
              scrolling="auto">
      </iframe>
    </div>

  </div>
    <script>
        const video = document.getElementById('video');
        const main = document.getElementById('main-container');
        const controls = document.getElementById('controls-bar');
        const loading = document.getElementById('loading-overlay');
        const offline = document.getElementById('offline-overlay');
        const startOverlay = document.getElementById('start-overlay');
        const volSlider = document.getElementById('volSlider');
        const playBtn = document.getElementById('playBtn');
        const liveBadge = document.getElementById('live-badge');
        const volumeArea = document.getElementById('volume-area');
        let hls, hideTimer, isStarted = false;

        video.volume = localStorage.getItem('playerVolume') || 1.0;
        volSlider.value = video.volume;

        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') e.target.blur();
        });

        function showUI() {
    if(!isStarted) return;
    
    // Show UI and Mouse
    controls.classList.add('ui-visible');
    main.classList.remove('cursor-hidden'); 
    
    clearTimeout(hideTimer);
    
    let timeoutDuration = (window.innerWidth < 1000) ? 5000 : 3000;
    
    if (!video.paused) {
        hideTimer = setTimeout(() => {
            // Hide UI and Mouse
            controls.classList.remove('ui-visible');
            main.classList.add('cursor-hidden'); 
        }, timeoutDuration);
    }
}

        function setOffline(isOff) {
            offline.style.display = isOff ? 'flex' : 'none';
            if (isOff) {
                isStarted = false;
                document.body.classList.add('hide-ui');
                loading.style.display = 'none';
                startOverlay.style.display = 'none';
                video.pause();
                video.muted = true;
            }
        }

        function syncLive() {
            if (hls && hls.liveSyncPosition) video.currentTime = hls.liveSyncPosition - 5;
        }

        function startPlayer() {
            isStarted = true;
            startOverlay.style.display = 'none';
            document.body.classList.remove('hide-ui');
            video.muted = false;
            syncLive();
            video.play();
            showUI();
        }

        function handleVideoClick() {
    if (!isStarted) {
        startPlayer();
        return;
    }

    // Check if the controls are already visible
    if (!controls.classList.contains('ui-visible')) {
        // If hidden, just show them and don't pause
        showUI();
    } else {
        // If already visible, then toggle the play/pause state
        togglePlay();
    }
}

        function initHls() {
            if (!Hls.isSupported()) return;
            if (hls) hls.destroy();
            
            loading.style.display = 'flex';
            
            hls = new Hls({ liveSyncDurationCount: 3, enableWorker: true });
            hls.loadSource('http://147.185.221.212:26420/jakpat/index.m3u8');
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                setOffline(false);
                // Video stays muted for preview, play is called to load data
                video.play().catch(() => {}); 
            });

            hls.on(Hls.Events.ERROR, (e, data) => {
                if (data.fatal) { 
                    setOffline(true); 
                    setTimeout(initHls, 3000); 
                }
            });
        }

        function togglePlay() { 
            if (video.paused) { syncLive(); video.play(); } 
            else { video.pause(); }
        }

        video.onplay = () => { playBtn.innerText = 'II'; };
        video.onpause = () => { playBtn.innerText = '▶'; };

        function toggleMute() { 
            video.muted = !video.muted; 
            document.getElementById('muteBtn').innerText = video.muted ? '🔇' : '🔊'; 
        }
        
        function updateVol(val) {
            let v = Math.max(0, Math.min(1, val));
            video.volume = v; video.muted = (v === 0);
            localStorage.setItem('playerVolume', v);
            document.getElementById('muteBtn').innerText = video.muted ? '🔇' : '🔊';
            volSlider.value = v;
        }

        volumeArea.addEventListener('wheel', (e) => {
            if (!isStarted) return;
            e.preventDefault();
            updateVol(video.volume + (e.deltaY < 0 ? 0.05 : -0.05));
        }, { passive: false });

        function toggleFS() { 
            if (!document.fullscreenElement) main.requestFullscreen(); 
            else document.exitFullscreen(); 
        }
        
        async function togglePiP() { 
            if (document.pictureInPictureElement) await document.exitPictureInPicture();
            else await video.requestPictureInPicture();
        }

        // This event fires once the video actually has data to show
        video.oncanplay = () => {
            if (!isStarted) {
                loading.style.display = 'none';
                startOverlay.style.display = 'flex';
                video.pause(); // Keep it paused as a preview frame
            }
        };

        video.onplaying = () => {
            if (isStarted) {
                loading.style.display = 'none';
                document.body.classList.remove('hide-ui');
            }
        };

        video.onwaiting = () => {
            if (isStarted) loading.style.display = 'flex';
        };

        window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
            if (e.code === 'Space') isStarted ? togglePlay() : startPlayer();
            if (e.code === 'ArrowUp') updateVol(video.volume + 0.1);
            if (e.code === 'ArrowDown') updateVol(video.volume - 0.1);
            if (e.code === 'KeyM') toggleMute();
            if (e.code === 'KeyL') syncLive();
            if (e.code === 'KeyF') toggleFS();
            if (e.code === 'KeyT') document.body.classList.toggle('theatre-mode');
            if (e.code === 'KeyP') togglePiP();
            showUI();
        });

        setInterval(() => {
            if (hls && hls.liveSyncPosition && isStarted) {
                const drift = hls.liveSyncPosition - video.currentTime;
                liveBadge.classList.toggle('is-live', drift < 15);
                if (drift > 45 && !video.paused) syncLive();
            }
        }, 2000);

        initHls();
    </script>
</body>
</html>
